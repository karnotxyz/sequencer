name: PM cached storage read correctness

on:
  push:
    branches: [codex/pm-cached-storage-read-20260926]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-cached-storage-read-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cached-state-regressions:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: ./.github/actions/setup_native_deps
      - uses: Swatinem/rust-cache@v2
        with:
          key: pm-hash-window-native
      - name: Scalar and bulk storage fast-path regressions
        run: cargo test --locked -p blockifier --lib --features cairo_native storage_read_fast_path -- --test-threads=1
      - name: Cached-state reads, diffs, commits and aborts
        run: |
          set -o pipefail
          cargo test --locked -p blockifier --lib --features cairo_native state::cached_state::test:: -- --test-threads=1 | tee "$RUNNER_TEMP/pm-cached-state-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/pm-cached-state-tests.log"
      - name: Preserve configured history-window behavior
        run: cargo test --locked -p blockifier --lib --features cairo_native configured_hash_window -- --test-threads=1
