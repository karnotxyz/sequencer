name: Committed Data Block Sharing Prototype Image
on:
  push:
    branches: [codex/committed-data-block-sharing-prototype-20261022]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: committed-data-block-sharing-prototype
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 build-essential clang libclang-dev cmake libgmp-dev libssl-dev pkg-config protobuf-compiler
          python -m pip install cairo-lang==0.14.1a0
          rustup toolchain install 1.95 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: committed-data-block-sharing-prototype
          cache-on-failure: true
      - name: Compile both benchmark arms; execute tests only on the mock cluster
        run: bash scripts/block_sharing_benchmark/build.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: scripts/block_sharing_benchmark/Dockerfile
          push: true
          tags: ghcr.io/karnotxyz/committed-data-block-sharing-benchmark:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/karnotxyz/sequencer
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Save provenance
        run: |
          printf '%s\n' '${{ steps.image.outputs.digest }}' > benchmark-bin/image-digest.txt
          printf '%s\n' '${{ github.sha }}' > benchmark-bin/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-sharing-provenance
          path: |
            benchmark-bin/SHA256SUMS
            benchmark-bin/image-digest.txt
            benchmark-bin/source-sha.txt
            benchmark-bin/*-build.jsonl
          retention-days: 7
